<!--
  Any OS: with the host-driven vblank (virtio_gpu.anyos_vblank, on by
  default) Xorg's Present reports a real MSC, and Mesa's DRI3 swap
  arithmetic in the X11 compositor then targets MSCs up to seconds ahead
  under several presenting clients (GNOME Shell stopped for 0.4-16 s with
  vkcube + glxgears, 2026-09-23). The compositor's flips are vsynced by the
  kernel anyway, so its own MSC wait is turned off.
-->
<driconf>
  <device>
    <application name="GNOME Shell" executable="gnome-shell">
      <option name="vblank_mode" value="0" />
    </application>
  </device>
</driconf>
